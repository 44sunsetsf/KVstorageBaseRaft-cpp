syntax = "proto3";


package raftKVRpcProctoc; //所在的命名空间

option cc_generic_services = true;  //开启stub服务

// 日志实体
message GetArgs{
  bytes Key = 1 ;
  bytes ClientId = 2 ;
  int32 RequestId = 3;
}


message GetReply  {
  //	下面几个参数和论文中相同
  bytes Err = 1;
  bytes Value = 2;

}


// Put or Append
message PutAppendArgs  {
  bytes Key = 1;
  bytes  Value = 2 ;
  bytes  Op = 3;
  // "Put" or "Append"
  // You'll have to add definitions here.
  // Field names must start with capital letters,
  // otherwise RPC will break.
  bytes  ClientId = 4;
  int32  RequestId = 5;
}

message PutAppendReply  {
  bytes Err = 1;
}


// 查询节点当前状态，给可视化页面和运维脚本用
message StatusArgs {
}

message LogBrief {
  int32 Index = 1;
  int32 Term = 2;
  bytes Summary = 3;  // 例如 "Put k=v"
}

message StatusReply {
  int32 NodeId = 1;
  int32 Role = 2;  // 0 Follower, 1 Candidate, 2 Leader
  int32 Term = 3;
  int32 VotedFor = 4;
  int32 CommitIndex = 5;
  int32 LastApplied = 6;
  int32 LastLogIndex = 7;
  int32 SnapshotIndex = 8;
  int32 KvCount = 9;
  int32 RaftStateBytes = 10;
  repeated LogBrief Tail = 11;  // 日志末尾若干条
}

//只有raft节点之间才会涉及rpc通信
service kvServerRpc
{
  //PutAppend(args *PutAppendArgs, reply *PutAppendReply)
  //Get(args *GetArgs, reply *GetReply)

  rpc PutAppend(PutAppendArgs) returns(PutAppendReply);
  rpc Get (GetArgs) returns (GetReply);
  rpc Status (StatusArgs) returns (StatusReply);
}
